<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VideoVault — Upload</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/tus-js-client@3.1.0/dist/tus.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #020010; font-family: 'Inter', sans-serif; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; }
    .bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 20% 50%, #1a0533 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, #0d1f4a 0%, transparent 60%), radial-gradient(ellipse at 50% 80%, #0a2a1a 0%, transparent 60%), #020010; }
    .stars { position: fixed; inset: 0; z-index: 0; background-image: radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.8) 0%, transparent 100%), radial-gradient(1px 1px at 30% 40%, rgba(255,255,255,0.6) 0%, transparent 100%), radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.9) 0%, transparent 100%), radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.5) 0%, transparent 100%), radial-gradient(1px 1px at 45% 75%, rgba(255,255,255,0.7) 0%, transparent 100%), radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,0.8) 0%, transparent 100%); }
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; animation: float 8s ease-in-out infinite; }
    .orb1 { width: 400px; height: 400px; background: rgba(120,40,200,0.15); top: -100px; left: -100px; }
    .orb2 { width: 300px; height: 300px; background: rgba(40,100,255,0.12); bottom: -50px; right: -50px; animation-delay: 3s; }
    .orb3 { width: 200px; height: 200px; background: rgba(0,200,150,0.1); top: 50%; left: 50%; animation-delay: 5s; }
    @keyframes float { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-30px) scale(1.05);} }
    .grid-lines { position: fixed; inset: 0; z-index: 0; opacity: 0.03; background-image: linear-gradient(rgba(255,255,255,1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,1) 1px, transparent 1px); background-size: 60px 60px; }
    nav { position: relative; z-index: 10; width: 100%; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
    .logo { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; background: linear-gradient(135deg, #a855f7, #3b82f6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
    .nav-link { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem; letter-spacing: 1px; padding: 8px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
    .nav-link:hover { color:#fff; border-color:rgba(168,85,247,0.5); background:rgba(168,85,247,0.1); }
    .hero { position: relative; z-index: 10; text-align: center; padding: 60px 20px 40px; }
    .hero-badge { display: inline-block; padding: 6px 18px; border-radius: 50px; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.3); color: #c084fc; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
    h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; line-height: 1.1; background: linear-gradient(135deg, #fff 0%, #a855f7 50%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; }
    .subtitle { color: rgba(255,255,255,0.4); font-size: 1rem; font-weight: 300; }
    .upload-container { position: relative; z-index: 10; width: 100%; max-width: 600px; padding: 0 20px 60px; }
    .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 40px; backdrop-filter: blur(20px); box-shadow: 0 0 0 1px rgba(168,85,247,0.05), 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); transition: transform 0.3s, box-shadow 0.3s; }
    .card:hover { transform: translateY(-4px) rotateX(1deg); box-shadow: 0 0 0 1px rgba(168,85,247,0.15), 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(168,85,247,0.08), inset 0 1px 0 rgba(255,255,255,0.08); }
    .info-badges { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .badge { flex: 1; min-width: 110px; padding: 10px 14px; border-radius: 10px; text-align: center; }
    .badge-green { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2); }
    .badge-blue  { background: rgba(59,130,246,0.08);  border: 1px solid rgba(59,130,246,0.2); }
    .badge-purple{ background: rgba(168,85,247,0.08);  border: 1px solid rgba(168,85,247,0.2); }
    .badge-val { font-size: 1rem; font-weight: 700; }
    .badge-green .badge-val { color: #6ee7b7; }
    .badge-blue  .badge-val { color: #93c5fd; font-size: 0.8rem; }
    .badge-purple .badge-val{ color: #c084fc; font-size: 0.85rem; }
    .badge-lbl { color: rgba(255,255,255,0.4); font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
    .drop-zone { border: 2px dashed rgba(168,85,247,0.3); border-radius: 16px; padding: 50px 20px; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
    .drop-zone::before { content:''; position:absolute; inset:0; background: radial-gradient(ellipse at center, rgba(168,85,247,0.05) 0%, transparent 70%); opacity:0; transition:opacity 0.3s; }
    .drop-zone:hover::before, .drop-zone.dragover::before { opacity:1; }
    .drop-zone:hover, .drop-zone.dragover { border-color:rgba(168,85,247,0.7); background:rgba(168,85,247,0.05); }
    .drop-icon { font-size:3.5rem; margin-bottom:16px; display:block; filter:drop-shadow(0 0 20px rgba(168,85,247,0.5)); animation:pulse-icon 2s ease-in-out infinite; }
    @keyframes pulse-icon { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
    .drop-title { color:#fff; font-size:1.1rem; font-weight:600; margin-bottom:8px; }
    .drop-sub { color:rgba(255,255,255,0.35); font-size:0.85rem; }
    #fileInput { display:none; }
    .file-info { display:none; margin-top:16px; padding:14px 18px; background:rgba(168,85,247,0.1); border:1px solid rgba(168,85,247,0.2); border-radius:12px; color:#c084fc; font-size:0.85rem; align-items:center; gap:10px; }
    .file-info.show { display:flex; }
    .file-info span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .progress-wrap { display:none; margin-top:20px; }
    .progress-wrap.show { display:block; }
    .progress-label { display:flex; justify-content:space-between; color:rgba(255,255,255,0.5); font-size:0.8rem; margin-bottom:8px; }
    .progress-bar-bg { height:8px; background:rgba(255,255,255,0.05); border-radius:50px; overflow:hidden; }
    .progress-bar { height:100%; width:0%; background:linear-gradient(90deg,#a855f7,#3b82f6); border-radius:50px; transition:width 0.2s; box-shadow:0 0 10px rgba(168,85,247,0.5); }
    .progress-speed { color:rgba(255,255,255,0.3); font-size:0.75rem; margin-top:6px; text-align:right; }
    .btn-upload { width:100%; margin-top:24px; padding:16px; background:linear-gradient(135deg,#7c3aed,#2563eb); border:none; border-radius:14px; color:#fff; font-size:1rem; font-weight:600; font-family:'Orbitron',sans-serif; letter-spacing:1px; cursor:pointer; position:relative; overflow:hidden; transition:all 0.3s; box-shadow:0 4px 20px rgba(124,58,237,0.4); }
    .btn-upload::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent); opacity:0; transition:opacity 0.3s; }
    .btn-upload:hover::before { opacity:1; }
    .btn-upload:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(124,58,237,0.6); }
    .btn-upload:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .toast { position:fixed; bottom:30px; right:30px; z-index:100; padding:14px 24px; border-radius:14px; font-size:0.9rem; font-weight:500; backdrop-filter:blur(20px); transform:translateY(100px); opacity:0; transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1); max-width:320px; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.3); color:#6ee7b7; box-shadow:0 0 30px rgba(16,185,129,0.15); }
    .toast.error   { background:rgba(239,68,68,0.15);  border:1px solid rgba(239,68,68,0.3);  color:#fca5a5; box-shadow:0 0 30px rgba(239,68,68,0.15); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="stars"></div>
  <div class="grid-lines"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <nav>
    <div class="logo">VideoVault</div>
    <a href="/videos" class="nav-link">▶ View Gallery</a>
  </nav>

  <div class="hero">
    <div class="hero-badge">✦ Powered by Supabase</div>
    <h1>Upload Your Videos</h1>
    <p class="subtitle">Chunked TUS upload. Instant cloud storage.</p>
  </div>

  <div class="upload-container">
    <div class="card">
      <div class="info-badges">
        <div class="badge badge-green"><div class="badge-val">∞</div><div class="badge-lbl">No Size Limit</div></div>
        <div class="badge badge-blue"><div class="badge-val">MP4 WebM MOV</div><div class="badge-lbl">Formats</div></div>
        <div class="badge badge-purple"><div class="badge-val">Supabase</div><div class="badge-lbl">Cloud Storage</div></div>
      </div>

      <div class="drop-zone" id="dropZone">
        <span class="drop-icon">🎬</span>
        <div class="drop-title">Drop your video here</div>
        <div class="drop-sub">or click to browse — any size supported</div>
        <input type="file" id="fileInput" accept="video/*" />
      </div>

      <div class="file-info" id="fileInfo">
        <span>🎞️</span>
        <span id="fileName"></span>
        <span id="fileSize" style="color:rgba(255,255,255,0.3);white-space:nowrap;"></span>
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-label">
          <span id="progressLabel">Uploading...</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-speed" id="progressSpeed"></div>
      </div>

      <button class="btn-upload" id="uploadBtn" onclick="uploadVideo()">
        ⚡ UPLOAD VIDEO
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    let selectedFile = null;
    let cfg = null;

    fetch('/api/config').then(r => r.json()).then(c => { cfg = c; });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault(); dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('video/')) setFile(file);
      else showToast('Please drop a valid video file', 'error');
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

    function setFile(file) {
      selectedFile = file;
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileSize').textContent = formatSize(file.size);
      document.getElementById('fileInfo').classList.add('show');
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    async function uploadVideo() {
      if (!selectedFile) return showToast('Please select a video first', 'error');
      if (!cfg) return showToast('Config not loaded, try again', 'error');

      const btn = document.getElementById('uploadBtn');
      const progressWrap = document.getElementById('progressWrap');
      const progressBar = document.getElementById('progressBar');
      const progressPct = document.getElementById('progressPct');
      const progressSpeed = document.getElementById('progressSpeed');
      const progressLabel = document.getElementById('progressLabel');

      btn.disabled = true;
      progressWrap.classList.add('show');

      const fileName = Date.now() + '-' + selectedFile.name.replace(/\s+/g, '_');
      const { supabaseUrl, supabaseKey, bucket } = cfg;
      let lastLoaded = 0, lastTime = Date.now();

      const upload = new tus.Upload(selectedFile, {
        endpoint: supabaseUrl + '/storage/v1/upload/resumable',
        retryDelays: [0, 3000, 5000, 10000],
        chunkSize: 6 * 1024 * 1024,
        headers: { authorization: 'Bearer ' + supabaseKey, apikey: supabaseKey },
        uploadDataDuringCreation: true,
        removeFingerprintOnSuccess: true,
        metadata: { bucketName: bucket, objectName: fileName, contentType: selectedFile.type, cacheControl: '3600' },
        onError(error) {
          btn.disabled = false;
          progressWrap.classList.remove('show');
          showToast('❌ Upload failed: ' + error.message, 'error');
        },
        onProgress(bytesUploaded, bytesTotal) {
          const pct = Math.round((bytesUploaded / bytesTotal) * 100);
          progressBar.style.width = pct + '%';
          progressPct.textContent = pct + '%';
          progressLabel.textContent = 'Uploading ' + formatSize(bytesUploaded) + ' of ' + formatSize(bytesTotal);
          const now = Date.now(), elapsed = (now - lastTime) / 1000;
          if (elapsed > 0.5) {
            progressSpeed.textContent = formatSize((bytesUploaded - lastLoaded) / elapsed) + '/s';
            lastLoaded = bytesUploaded; lastTime = now;
          }
        },
        onSuccess() {
          progressBar.style.width = '100%';
          progressPct.textContent = '100%';
          progressLabel.textContent = 'Upload complete!';
          progressSpeed.textContent = '';
          showToast('✅ Video uploaded successfully!', 'success');
          btn.disabled = false;
          setTimeout(() => {
            progressWrap.classList.remove('show');
            progressBar.style.width = '0%';
            document.getElementById('fileInfo').classList.remove('show');
            selectedFile = null; fileInput.value = '';
            progressLabel.textContent = 'Uploading...';
          }, 2500);
        },
      });
      upload.start();
    }

    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast ' + type + ' show';
      setTimeout(() => toast.classList.remove('show'), 4000);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VideoVault — Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #020010;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 20% 50%, #1a0533 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, #0d1f4a 0%, transparent 60%),
                  radial-gradient(ellipse at 50% 80%, #0a2a1a 0%, transparent 60%),
                  #020010;
    }

    .stars {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 40%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 75%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 90%, rgba(255,255,255,0.4) 0%, transparent 100%);
    }

    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; animation: float 8s ease-in-out infinite;
    }
    .orb1 { width: 400px; height: 400px; background: rgba(120,40,200,0.15); top: -100px; left: -100px; }
    .orb2 { width: 300px; height: 300px; background: rgba(40,100,255,0.12); bottom: -50px; right: -50px; animation-delay: 3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
    }

    .grid-lines {
      position: fixed; inset: 0; z-index: 0; opacity: 0.03;
      background-image: linear-gradient(rgba(255,255,255,1) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,1) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    nav {
      position: relative; z-index: 10;
      width: 100%; padding: 20px 40px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem; font-weight: 900;
      background: linear-gradient(135deg, #a855f7, #3b82f6, #06b6d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .nav-link {
      color: rgba(255,255,255,0.6); text-decoration: none;
      font-size: 0.9rem; letter-spacing: 1px;
      padding: 8px 20px; border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    .nav-link:hover {
      color: #fff; border-color: rgba(168,85,247,0.5);
      background: rgba(168,85,247,0.1);
      box-shadow: 0 0 20px rgba(168,85,247,0.2);
    }

    .page-header {
      position: relative; z-index: 10;
      text-align: center; padding: 50px 20px 30px;
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 18px; border-radius: 50px;
      background: rgba(168,85,247,0.15);
      border: 1px solid rgba(168,85,247,0.3);
      color: #c084fc; font-size: 0.75rem; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 20px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      background: linear-gradient(135deg, #fff 0%, #a855f7 50%, #3b82f6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      color: rgba(255,255,255,0.35); font-size: 0.95rem;
    }

    /* Stats bar */
    .stats-bar {
      position: relative; z-index: 10;
      display: flex; justify-content: center; gap: 30px;
      padding: 0 20px 30px; flex-wrap: wrap;
    }

    .stat {
      text-align: center;
      padding: 12px 24px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .stat-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem; font-weight: 700;
      background: linear-gradient(135deg, #a855f7, #3b82f6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .stat-label {
      color: rgba(255,255,255,0.3); font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase;
    }

    /* Grid */
    .gallery {
      position: relative; z-index: 10;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      padding: 0 40px 60px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Video Card */
    .video-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      animation: cardIn 0.5s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .video-card:hover {
      transform: translateY(-8px) rotateX(3deg) rotateY(-1deg) scale(1.02);
      border-color: rgba(168,85,247,0.3);
      box-shadow:
        0 20px 60px rgba(0,0,0,0.6),
        0 0 40px rgba(168,85,247,0.15),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* Glow line on top */
    .video-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(168,85,247,0.6), rgba(59,130,246,0.6), transparent);
      opacity: 0; transition: opacity 0.3s; z-index: 2;
    }
    .video-card:hover::before { opacity: 1; }

    .video-thumb {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover; display: block;
      background: #0a0a1a;
    }

    .video-overlay {
      position: absolute; top: 0; left: 0; right: 0;
      aspect-ratio: 16/9;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.8) 100%);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.3s;
    }

    .video-card:hover .video-overlay { opacity: 1; }

    .play-btn {
      width: 60px; height: 60px;
      background: rgba(168,85,247,0.9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 30px rgba(168,85,247,0.6);
      transform: scale(0.8); transition: transform 0.3s;
    }

    .video-card:hover .play-btn { transform: scale(1); }

    .video-info {
      padding: 16px 18px;
    }

    .video-name {
      color: #fff; font-size: 0.9rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .video-meta {
      display: flex; justify-content: space-between; align-items: center;
    }

    .video-date {
      color: rgba(255,255,255,0.3); font-size: 0.75rem;
    }

    .video-size {
      padding: 3px 10px; border-radius: 50px;
      background: rgba(168,85,247,0.1);
      border: 1px solid rgba(168,85,247,0.2);
      color: #c084fc; font-size: 0.7rem;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: rgba(10,5,25,0.97);
      border: 1px solid rgba(168,85,247,0.25);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: min(900px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      display: flex; flex-direction: column;
      box-shadow: 0 0 80px rgba(168,85,247,0.25);
      animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; flex-shrink: 0;
    }

    .modal-title {
      color: #fff; font-size: 0.95rem; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 85%;
    }

    .modal-close {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6);
      width: 34px; height: 34px; border-radius: 50%;
      cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .modal-close:hover { background: rgba(239,68,68,0.2); color: #f87171; border-color: rgba(239,68,68,0.3); }

    .modal-video-wrap {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .modal video {
      width: 100%; height: 100%;
      max-width: 100%;
      max-height: calc(100vh - 120px);
      border-radius: 12px;
      background: #000;
      object-fit: contain;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      display: block;
    }

    /* Loading / Empty */
    .state-container {
      position: relative; z-index: 10;
      text-align: center; padding: 80px 20px;
    }

    .loading-spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(168,85,247,0.1);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .state-text {
      color: rgba(255,255,255,0.3); font-size: 0.95rem;
    }

    .empty-icon { font-size: 4rem; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="stars"></div>
  <div class="grid-lines"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <nav>
    <div class="logo">VideoVault</div>
    <a href="/" class="nav-link">⬆ Upload Video</a>
  </nav>

  <div class="page-header">
    <div class="hero-badge">✦ Cloud Gallery</div>
    <h1>Video Gallery</h1>
    <p class="subtitle">All your uploaded videos in one place</p>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-num" id="totalCount">—</div>
      <div class="stat-label">Total Videos</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="totalSize">—</div>
      <div class="stat-label">Total Size</div>
    </div>
  </div>

  <div id="loadingState" class="state-container">
    <div class="loading-spinner"></div>
    <div class="state-text">Loading your videos...</div>
  </div>

  <div id="emptyState" class="state-container" style="display:none;">
    <div class="empty-icon">🎬</div>
    <div class="state-text">No videos yet. <a href="/" style="color:#a855f7;">Upload your first one!</a></div>
  </div>

  <div class="gallery" id="gallery"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle"></div>
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
      </div>
      <div class="modal-video-wrap">
        <video id="modalVideo" controls autoplay></video>
      </div>
    </div>
  </div>

  <script>
    let allVideos = [];

    async function loadVideos() {
      try {
        const res = await fetch('/api/videos');
        const videos = await res.json();
        allVideos = videos;

        document.getElementById('loadingState').style.display = 'none';

        if (!videos.length) {
          document.getElementById('emptyState').style.display = 'block';
          return;
        }

        document.getElementById('totalCount').textContent = videos.length;

        const totalBytes = videos.reduce((sum, v) => sum + (v.size || 0), 0);
        document.getElementById('totalSize').textContent = formatSize(totalBytes);

        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        videos.forEach((v, i) => {
          const card = document.createElement('div');
          card.className = 'video-card';
          card.style.animationDelay = (i * 0.08) + 's';

          const cleanName = v.name.replace(/^\d+-/, '').replace(/_/g, ' ');
          const date = v.created_at ? new Date(v.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';

          card.innerHTML = `
            <div style="position:relative;">
              <video class="video-thumb" src="${v.url}" preload="metadata" muted></video>
              <div class="video-overlay">
                <div class="play-btn">▶</div>
              </div>
            </div>
            <div class="video-info">
              <div class="video-name" title="${cleanName}">${cleanName}</div>
              <div class="video-meta">
                <span class="video-date">${date}</span>
                ${v.size ? `<span class="video-size">${formatSize(v.size)}</span>` : ''}
              </div>
            </div>
          `;

          card.addEventListener('click', () => openModal(v.url, cleanName));
          gallery.appendChild(card);
        });

      } catch (err) {
        document.getElementById('loadingState').innerHTML = `
          <div class="empty-icon">⚠️</div>
          <div class="state-text">Failed to load videos. Check your connection.</div>
        `;
      }
    }

    function openModal(url, name) {
      document.getElementById('modalVideo').src = url;
      document.getElementById('modalTitle').textContent = name;
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
    }

    function closeModalDirect() {
      const video = document.getElementById('modalVideo');
      video.pause();
      video.src = '';
      document.getElementById('modalOverlay').classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModalDirect();
    });

    function formatSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    loadVideos();
  </script>
</body>
</html>
